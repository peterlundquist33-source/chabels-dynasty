<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams — Chabels Dynasty</title>
  <meta name="description" content="Every Chabels Dynasty franchise — career record, arena banners, rivals, and the season-by-season story.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=20260908a">
</head>
<body>
  <div id="site-nav"></div>

  <section class="page-header">
    <h1><span class="accent">Team</span> Profiles</h1>
    <p>Ten franchises, four seasons. Pick one for its full dynasty story.</p>
  </section>

  <section class="section">
    <div id="team-grid" class="tile-grid"></div>

    <div style="margin-top:1.5rem; display:flex; align-items:center; gap:0.6rem;">
      <label for="team-select" class="eyebrow" style="margin:0;">Jump to</label>
      <select id="team-select" onchange="showTeam(this.value)">
        <option value="">— select —</option>
      </select>
    </div>

    <div id="team-profile" hidden style="margin-top:2.5rem;">
      <div style="border-bottom:var(--hair); padding-bottom:1.4rem; margin-bottom:1.6rem;">
        <span class="eyebrow" id="tp-chip"></span>
        <h2 id="tp-name" style="font-size:1.9rem; margin:0.2rem 0 0.15rem;"></h2>
        <p id="tp-career" class="mono" style="color:var(--text-3); font-size:0.85rem;"></p>
      </div>

      <article class="feature-card" style="margin-bottom:1.6rem;">
        <svg class="icon icon-lg icon-accent" aria-hidden="true"><use href="#i-list"></use></svg>
        <div>
          <span class="eyebrow">The Dynasty Story</span>
          <p id="tp-article" style="color:var(--text-2); margin-top:0.5rem; line-height:1.7;"></p>
        </div>
      </article>

      <h3 class="section-title" style="font-size:1.1rem;">Arena Banners</h3>
      <div id="tp-banners" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:0.7rem; margin:0.7rem 0 1.8rem;"></div>

      <div class="info-block" style="margin-bottom:1.8rem;">
        <span class="eyebrow">Biggest Rival</span>
        <p id="tp-rival" style="margin-top:0.4rem;"></p>
      </div>

      <div class="feature-grid" style="margin-bottom:1.8rem;">
        <article class="card" style="text-align:left;">
          <span class="stat-label">Career trades</span>
          <div class="stat" id="tp-trades"></div>
        </article>
        <article class="card" style="text-align:left;">
          <span class="stat-label">Best single week</span>
          <div class="stat" id="tp-bestweek"></div>
          <div class="stat-sub" id="tp-bestweek-info"></div>
        </article>
        <article class="card" style="text-align:left;">
          <span class="stat-label">Career points for</span>
          <div class="stat" id="tp-pf"></div>
        </article>
      </div>

      <h3 class="section-title" style="font-size:1.1rem;">Season by Season</h3>
      <div id="tp-seasons" style="margin:0.7rem 0 1.8rem;"></div>

      <h3 class="section-title" style="font-size:1.1rem;">Head to Head</h3>
      <div id="tp-h2h" style="margin-top:0.7rem; max-width:420px;"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js?v=20260908a"></script>
  <script src="js/sleeper.js?v=20260908a"></script>
  <script src="js/teams-data.js"></script>
  <script>
  function cleanBanners(html) {
    return String(html || '')
      .replace(/[\u{1F000}-\u{1FAFF}☀-➿⬀-⯿]️?/gu, '')
      .replace(/<div[^>]*style="[^"]*"[^>]*>/g, '<div class="tp-banner">')
      .replace(/<span[^>]*style="font-size:0\.7rem;?"[^>]*>/g, '<span class="tp-banner-sub">')
      .replace(/<br>\s*/g, '<br>')
      .replace(/>\s+(?=[A-Z0-9])/g, '>');
  }

  (function () {
    var names = Object.keys(TEAM_DATA);
    var grid = document.getElementById('team-grid');
    var select = document.getElementById('team-select');

    names.forEach(function (name) {
      var t = TEAM_DATA[name];
      var a = document.createElement('a');
      a.href = '?team=' + encodeURIComponent(name);
      a.className = 'tile';
      a.innerHTML =
        '<div class="tile-name">' + name + (t.chip ? ' <svg class="icon icon-accent" aria-hidden="true" style="width:.9em;height:.9em"><use href="#i-trophy"></use></svg>' : '') + '</div>' +
        '<div class="tile-sub">' + t.career_w + '–' + t.career_l + ' · ' + t.career_wp + '%</div>' +
        '<div class="tile-meta">' + Number(String(t.career_pf).replace(/,/g,'')).toLocaleString() + ' career PF</div>';
      a.addEventListener('click', function (e) { e.preventDefault(); showTeam(name); history.replaceState(null, '', a.href); });
      grid.appendChild(a);

      var opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      select.appendChild(opt);
    });

    window.showTeam = function (name) {
      var profile = document.getElementById('team-profile');
      if (!name || !TEAM_DATA[name]) { profile.hidden = true; return; }
      var t = TEAM_DATA[name];
      profile.hidden = false;
      select.value = name;
      document.getElementById('tp-name').textContent = name;
      document.getElementById('tp-career').textContent =
        t.career_w + '–' + t.career_l + ' career (' + t.career_wp + '%) · ' + t.career_pf + ' PF';
      document.getElementById('tp-chip').textContent = t.chip ? 'Champion — ' + t.chip : 'Franchise profile';
      document.getElementById('tp-banners').innerHTML = cleanBanners(t.banners_html);
      document.getElementById('tp-rival').innerHTML =
        '<strong style="color:var(--text)">' + t.rival + '</strong> — all-time <strong style="color:var(--accent)">' + t.rival_rec + '</strong>';
      document.getElementById('tp-seasons').innerHTML = t.seasons_html;
      document.getElementById('tp-h2h').innerHTML = t.h2h_html;
      document.getElementById('tp-trades').textContent = t.trades;
      document.getElementById('tp-bestweek').textContent = t.best_week_score;
      document.getElementById('tp-bestweek-info').textContent = t.best_week_info;
      document.getElementById('tp-pf').textContent = t.career_pf;
      document.getElementById('tp-article').textContent = t.article || '';
      window.scrollTo({ top: profile.offsetTop - 70, behavior: 'smooth' });
    };

    var initial = new URLSearchParams(location.search).get('team');
    if (initial && TEAM_DATA[initial]) showTeam(initial);
  })();
  </script>
  <script src="js/site.js?v=20260908a"></script>
</body>
</html>
